name: Aggiornamento radar e telemetria

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy opencv-python-headless Pillow

      - name: Esecuzione script Tracker.py
        run: python Tracker.py

      - name: Commit e push modifiche
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add centroids.json profiles/
          git diff --staged --quiet || git commit -m "Aggiornamento automatico telemetria e profili 3D [skip ci]"
          git push
          
