name: Aggiornamento Radar e Telemetria

on:
  schedule:
    # Esegue lo script ogni 30 minuti in modo automatico
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna-dati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy opencv-python-headless

      - name: Esegui script tracker
        run: python Tracker.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add centroids.json
          git diff --staged --quiet || git commit -m "Aggiornamento automatico telemetria e centroidi [skip ci]"
          git push
          
