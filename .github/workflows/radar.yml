name: Aggiorna Tracker Globale

on:
  schedule:
    - cron: '*/30 * * * *'  # Esegue il tracker ogni 30 minuti
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy opencv-python-headless

      - name: Esecuzione Tracker.py
        run: python Tracker.py

      - name: Commit e push di JSON e cartella profili
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add centroids.json profili/
          git diff --staged --quiet || git commit -m "Aggiornamento automatico dati radar, sismi e profili volumetrici"
          git push
          
