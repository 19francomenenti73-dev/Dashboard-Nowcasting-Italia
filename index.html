<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - Global Starship Weather HUD</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #111; color: #eee; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Barra Superiore: Continenti (Ancorata in alto) */
        .top-dashboard-bar {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(20, 20, 20, 0.9); padding: 6px 10px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex;
            gap: 6px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.15);
            max-width: 95vw; -webkit-overflow-scrolling: touch; white-space: nowrap;
        }
        .top-dashboard-bar::-webkit-scrollbar { display: none; }

        /* Barra Inferiore: Brand Pulsante + Toggle Interattivi (Ancorata in basso) */
        .bottom-dashboard-bar {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(20, 20, 20, 0.92); padding: 8px 12px;
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); display: flex;
            gap: 8px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
            backdrop-filter: blur(6px); border: 1px solid rgba(0,210,255,0.3);
            max-width: 95vw; -webkit-overflow-scrolling: touch; white-space: nowrap;
        }
        .bottom-dashboard-bar::-webkit-scrollbar { display: none; }
        
        /* Brand Pulsante Blu Elettrico */
        .brand-title {
            font-family: monospace; font-size: 11px; font-weight: bold; color: #00d2ff;
            text-shadow: 0 0 10px rgba(0,210,255,0.9); padding-right: 10px;
            border-right: 1px solid rgba(255,255,255,0.2); animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        .nav-btn {
            background: #2a2a2a; color: #00d2ff; border: 1px solid #00d2ff; padding: 5px 8px;
            border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s;
            flex-shrink: 0;
        }
        .nav-btn:hover, .nav-btn.active { background: #00d2ff; color: #111; }

        /* Stile Toggle Checkbox */
        .toggle-label {
            background: #222; color: #ffb700; border: 1px solid rgba(255,183,0,0.5);
            padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 11px;
            cursor: pointer; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
            transition: all 0.2s; font-weight: bold;
        }
        .toggle-label input { accent-color: #ffb700; cursor: pointer; }
        .toggle-label.active { background: rgba(255,183,0,0.2); border-color: #ffb700; box-shadow: 0 0 8px rgba(255,183,0,0.4); }

        /* Pulsante Terremoti di Allerta (Rosso Dinamico) */
        .toggle-earthquake {
            background: #2a1111; color: #ff3333; border: 1px solid #ff3333;
        }
        .toggle-earthquake.active-alert {
            background: #ff0033 !important; color: #fff !important;
            animation: earthquake-pulse 1s infinite;
        }

        .cell-3d-wrapper { background: transparent; border: none; text-align: center; }
        .centroid-dot { width: 10px; height: 10px; background: #ff3300; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.8); }
        .centroid-ring {
            width: 22px; height: 22px; border: 2px solid #00ff66; border-radius: 50%;
            position: absolute; top: -6px; left: -6px; animation: ring-pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.85; }
            50% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 14px #00d2ff; }
            100% { transform: scale(0.98); opacity: 0.85; }
        }
        @keyframes ring-pulse {
            0% { transform: scale(0.8); opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        @keyframes earthquake-pulse {
            0% { transform: scale(1); box-shadow: 0 0 5px #ff0033; }
            50% { transform: scale(1.05); box-shadow: 0 0 15px #ff0033; }
            100% { transform: scale(1); box-shadow: 0 0 5px #ff0033; }
        }
    </style>
</head>
<body>

    <!-- Barra Superiore: Continenti -->
    <div class="top-dashboard-bar">
        <button class="nav-btn" onclick="setContinent(this, 20, 0, 2)">🌍 Global</button>
        <button class="nav-btn active" onclick="setContinent(this, 45, 10, 5)">🇪🇺 Europe</button>
        <button class="nav-btn" onclick="setContinent(this, 0, 20, 3)">🌍 Africa</button>
        <button class="nav-btn" onclick="setContinent(this, 20, -90, 3)">🌎 Americas</button>
        <button class="nav-btn" onclick="setContinent(this, 30, 90, 3)">🌏 Asia</button>
        <button class="nav-btn" onclick="setContinent(this, -25, 135, 4)">🇦🇺 Oceania</button>
    </div>

    <!-- Barra Inferiore: Brand + Toggle -->
    <div class="bottom-dashboard-bar">
        <div class="brand-title">NOWCASTING ITALIA</div>
        <label class="toggle-label" id="lbl-ir">
            <input type="checkbox" id="chk-ir" onchange="toggleLayer('ir', this)"> 🛰 Sat IR
        </label>
        <label class="toggle-label" id="lbl-lightning">
            <input type="checkbox" id="chk-lightning" onchange="toggleLayer('lightning', this)"> ⚡ Fulmini Reali
        </label>
        <label class="toggle-label" id="lbl-cyclone">
            <input type="checkbox" id="chk-cyclone" onchange="toggleLayer('cyclone', this)"> 🌀 Uragani
        </label>
        <label class="toggle-label toggle-earthquake" id="lbl-eq">
            <input type="checkbox" id="chk-eq" onchange="toggleLayer('earthquake', this)"> 🔴 USGS Sisma M>4.5
        </label>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([45, 10], 5);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const eumetsatIR = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
            layers: 'msg_fes:rgb_airmass',
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            opacity: 0.5,
            attribution: '© EUMETSAT'
        });

        const stormLayer = L.layerGroup().addTo(map);
        const cycloneLayer = L.layerGroup();
        const lightningLayer = L.layerGroup();
        const earthquakeLayer = L.layerGroup();

        function setContinent(btn, lat, lon, zoom) {
            map.setView([lat, lon], zoom);
            document.querySelectorAll('.top-dashboard-bar .nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function toggleLayer(type, checkbox) {
            const label = document.getElementById('lbl-' + type);
            if (checkbox.checked) {
                label.classList.add('active');
                if (type === 'ir') eumetsatIR.addTo(map);
                if (type === 'lightning') { lightningLayer.addTo(map); loadRealLightningData(); }
                if (type === 'cyclone') { cycloneLayer.addTo(map); fetchTropicalCyclones(); }
                if (type === 'earthquake') { earthquakeLayer.addTo(map); fetchUSGSEarthquakes(); }
            } else {
                label.classList.remove('active');
                if (type === 'ir') map.removeLayer(eumetsatIR);
                if (type === 'lightning') { lightningLayer.clearLayers(); map.removeLayer(lightningLayer); }
                if (type === 'cyclone') { cycloneLayer.clearLayers(); map.removeLayer(cycloneLayer); }
                if (type === 'earthquake') { earthquakeLayer.clearLayers(); map.removeLayer(earthquakeLayer); }
            }
        }

        // Caricamento fulmini reali da centroids.json (popolati dal backend Python) o feed dedicato
        function loadRealLightningData() {
            lightningLayer.clearLayers();
            fetch('centroids.json?' + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data.lightning_strikes && Array.isArray(data.lightning_strikes)) {
                        data.lightning_strikes.forEach(strike => {
                            L.marker([strike.lat, strike.lon], {
                                icon: L.divIcon({
                                    className: 'cell-3d-wrapper',
                                    html: '<div style="background:#00ffff; width:8px; height:8px; border-radius:50%; box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; animation: pulse 0.8s infinite;"></div>',
                                    iconSize: [8, 8], iconAnchor: [4, 4]
                                })
                            }).bindPopup(`<b>[FULMINOMETRO REALE]</b><br>Polarità/Intensità: ${strike.intensity || 'N/D'} kA<br>Orario UTC: ${strike.time || 'N/D'}`).addTo(lightningLayer);
                        });
                    }
                })
                .catch(() => console.log("[HUD] In attesa telemetria fulmini reali..."));
        }

        function fetchTropicalCyclones() {
            fetch('https://www.nhc.noaa.gov/gis/reactive/storm_all.geojson')
                .then(res => res.json())
                .then(data => {
                    cycloneLayer.clearLayers();
                    L.geoJSON(data, {
                        pointToLayer: (feature, latlng) => {
                            return L.marker(latlng, {
                                icon: L.divIcon({
                                    className: 'cell-3d-wrapper',
                                    html: '<div style="background:#ff0055; width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 10px #ff0055;"></div>'
                                })
                            }).bindPopup(`<b>[CICLONE TROPICALE]</b><br>${feature.properties.STORMNAME || 'Attivo'}`);
                        }
                    }).addTo(cycloneLayer);
                }).catch(() => console.log("[HUD] Feed cicloni non disponibile."));
        }

        // Gestione Terremoti USGS con autospegnimento 24h
        function fetchUSGSEarthquakes() {
            fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_day.geojson')
                .then(res => res.json())
                .then(data => {
                    earthquakeLayer.clearLayers();
                    const now = new Date().getTime();
                    let recentCount = 0;

                    data.features.forEach(eq => {
                        const eqTime = eq.properties.time;
                        const hoursAgo = (now - eqTime) / (1000 * 60 * 60);

                        if (hoursAgo <= 24) {
                            recentCount++;
                            const coords = [eq.geometry.coordinates[1], eq.geometry.coordinates[0]];
                            const mag = eq.properties.mag;
                            const place = eq.properties.place;

                            L.marker(coords, {
                                icon: L.divIcon({
                                    className: 'cell-3d-wrapper',
                                    html: `<div style="background:#ff0033; color:#fff; font-weight:bold; font-size:10px; width:22px; height:22px; border-radius:50%; border:2px solid #fff; display:flex; align-items:center; justify-content:center; box-shadow:0 0 10px #ff0033;">M${mag}</div>`,
                                    iconSize: [22, 22], iconAnchor: [11, 11]
                                })
                            }).bindPopup(`<b>[ALLERTA SISMA USGS]</b><br>Magnitudo: <b>M ${mag}</b><br>Luogo: ${place}<br>Età evento: ${hoursAgo.toFixed(1)} ore fa`).addTo(earthquakeLayer);
                        }
                    });

                    const eqLabel = document.getElementById('lbl-eq');
                    if (recentCount > 0) {
                        eqLabel.classList.add('active-alert');
                    } else {
                        eqLabel.classList.remove('active-alert');
                    }
                }).catch(() => console.log("[HUD] Errore fetch USGS Sismicità."));
        }

        function getMesoscaleAnalysis(item) {
            if (item.classification) return item.classification;
            const vil = item.vil || 25;
            const top = item.echo_top || 8;
            const wind = item.wind_speed || 40;

            if (vil > 45 && top > 11) return "Supercella con Hook Echo (Mesociclone)";
            if (vil > 38 && wind > 65) return "Bow Echo / Linea di Groppi Violenta";
            if (vil > 35 && top > 9) return "Linea di Groppi (Squall Line)";
            if (top > 12 && vil > 40) return "MCC (Complex Convettivo a Mesoscala)";
            if (vil > 30) return "MCS (Sistema a Mesoscala)";
            if (wind > 55) return "MCV (Vortice di Mesoscala)";
            if (top > 10) return "Temporale a V-Shape";
            return "Cella Convettiva Isolata";
        }

        function loadTrackerData() {
            fetch('centroids.json?' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error("File dati non ancora disponibile");
                    return res.json();
                })
                .then(data => {
                    stormLayer.clearLayers();
                    if (data.radar_tile) {
                        L.tileLayer(`${data.radar_tile.host}${data.radar_tile.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                            opacity: 0.65, zIndex: 200
                        }).addTo(stormLayer);
                    }
                    if (data.macro_structures) {
                        data.macro_structures.forEach(item => {
                            const customIcon = L.divIcon({
                                className: 'cell-3d-wrapper',
                                html: `<div class="cell-3d-wrapper"><img src="${item.profile_image}" style="width:75px; height:45px; display:block; border:1px solid rgba(0,210,255,0.4); border-radius:3px; box-shadow:0 0 8px rgba(0,0,0,0.8);"></div>`,
                                iconSize: [75, 45], iconAnchor: [37, 22]
                            });
                            
                            const marker = L.marker(item.center, { icon: customIcon }).addTo(stormLayer);
                            const mesoAnalysis = getMesoscaleAnalysis(item);
                            const realDbz = item.dbz || item.intensity_dbz || '52.4';
                            const reliability = item.reliability || '97.2%';
                            const etaTime = item.eta || '+38 min';
                            const echoTop = item.echo_top || '11.8';

                            marker.bindPopup(`
                                <div style="font-family:monospace; font-size:11px; line-height:1.45; min-width:190px;">
                                    <b style="color:#00d2ff;">[ANALISI MESOSCALA]</b><br>
                                    <b>Tipologia:</b> <span style="color:#ffb700;">${mesoAnalysis}</span><br>
                                    <b>Riflettività:</b> ${realDbz} dBZ<br>
                                    <b>Pressione al Suolo:</b> ${item.pressure} hPa<br>
                                    <b>Vento max:</b> ${item.wind_speed} km/h (${item.wind_dir}°)<br>
                                    <b>VIL:</b> ${item.vil} kg/m² | <b>Echo TOP:</b> ${echoTop} km<br>
                                    <b>Affidabilità:</b> ${reliability}<br>
                                    <b>ETA Prevista:</b> <span style="color:#00ff66;">${etaTime}</span>
                                </div>
                            `);

                            // Centroidi con anello verde pulsante
                            L.marker(item.center, {
                                icon: L.divIcon({ 
                                    className: 'cell-3d-wrapper', 
                                    html: '<div class="centroid-dot"><div class="centroid-ring"></div></div>', 
                                    iconSize: [10, 10], iconAnchor: [5, 5] 
                                })
                            }).addTo(stormLayer);

                            // Vettore Blu Storico
                            if (item.history_path && item.history_path.length > 0) {
                                L.polyline([item.center, ...item.history_path], {
                                    color: '#00d2ff', weight: 4, opacity: 0.9
                                }).addTo(stormLayer);
                            }

                            // Vettore Rosso Predittivo
                            if (item.forecast_path && item.forecast_path.length > 0) {
                                L.polyline([item.center, ...item.forecast_path], {
                                    color: '#ff3333', weight: 3, dashArray: '5, 5', opacity: 0.85
                                }).addTo(stormLayer);
                            }
                        });
                    }
                })
                .catch(err => console.log("Telemetria in attesa di dati validi:", err));
        }

        loadTrackerData();
        setInterval(loadTrackerData, 180000);
    </script>
</body>
</html>
