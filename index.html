<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nowcasting Italia - Global Starship Weather HUD</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; background: #111; color: #eee; overflow: hidden; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Barra Superiore: Continenti (Ancorata in alto) */
        .top-dashboard-bar {
            position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(20, 20, 20, 0.9); padding: 6px 10px;
            border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.6); display: flex;
            gap: 6px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
            backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.15);
            max-width: 95vw; -webkit-overflow-scrolling: touch; white-space: nowrap;
        }
        .top-dashboard-bar::-webkit-scrollbar { display: none; }

        /* Barra Inferiore: Brand Pulsante + Checkbox Toggles (Ancorata in basso) */
        .bottom-dashboard-bar {
            position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(20, 20, 20, 0.92); padding: 8px 12px;
            border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.7); display: flex;
            gap: 8px; align-items: center; flex-wrap: nowrap; overflow-x: auto;
            backdrop-filter: blur(6px); border: 1px solid rgba(0,210,255,0.3);
            max-width: 95vw; -webkit-overflow-scrolling: touch; white-space: nowrap;
        }
        .bottom-dashboard-bar::-webkit-scrollbar { display: none; }
        
        /* Brand Pulsante Blu Elettrico */
        .brand-title {
            font-family: monospace; font-size: 11px; font-weight: bold; color: #00d2ff;
            text-shadow: 0 0 10px rgba(0,210,255,0.9); padding-right: 10px;
            border-right: 1px solid rgba(255,255,255,0.2); animation: pulse 2s infinite;
            flex-shrink: 0;
        }

        .nav-btn {
            background: #2a2a2a; color: #00d2ff; border: 1px solid #00d2ff; padding: 5px 8px;
            border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; transition: all 0.2s;
            flex-shrink: 0;
        }
        .nav-btn:hover, .nav-btn.active { background: #00d2ff; color: #111; }

        /* Stile Toggle Checkbox */
        .toggle-label {
            background: #222; color: #ffb700; border: 1px solid rgba(255,183,0,0.5);
            padding: 5px 8px; border-radius: 4px; font-family: monospace; font-size: 11px;
            cursor: pointer; display: flex; align-items: center; gap: 5px; flex-shrink: 0;
            transition: all 0.2s; font-weight: bold;
        }
        .toggle-label input { accent-color: #ffb700; cursor: pointer; }
        .toggle-label.active { background: rgba(255,183,0,0.2); border-color: #ffb700; box-shadow: 0 0 8px rgba(255,183,0,0.4); }

        .cell-3d-wrapper { background: transparent; border: none; text-align: center; }
        .centroid-dot { width: 10px; height: 10px; background: #ff3300; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 6px rgba(0,0,0,0.8); }
        
        @keyframes pulse {
            0% { transform: scale(0.98); opacity: 0.85; }
            50% { transform: scale(1.02); opacity: 1; text-shadow: 0 0 14px #00d2ff; }
            100% { transform: scale(0.98); opacity: 0.85; }
        }
    </style>
</head>
<body>

    <!-- Barra Superiore: Continenti -->
    <div class="top-dashboard-bar">
        <button class="nav-btn" onclick="setContinent(this, 20, 0, 2)">🌍 Global</button>
        <button class="nav-btn active" onclick="setContinent(this, 45, 10, 5)">🇪🇺 Europe</button>
        <button class="nav-btn" onclick="setContinent(this, 0, 20, 3)">🌍 Africa</button>
        <button class="nav-btn" onclick="setContinent(this, 20, -90, 3)">🌎 Americas</button>
        <button class="nav-btn" onclick="setContinent(this, 30, 90, 3)">🌏 Asia</button>
        <button class="nav-btn" onclick="setContinent(this, -25, 135, 4)">🇦🇺 Oceania</button>
    </div>

    <!-- Barra Inferiore: Brand Pulsante + Toggle Interattivi -->
    <div class="bottom-dashboard-bar">
        <div class="brand-title">NOWCASTING ITALIA</div>
        <label class="toggle-label" id="lbl-ir">
            <input type="checkbox" id="chk-ir" onchange="toggleLayer('ir', this)"> 🛰️ Sat IR
        </label>
        <label class="toggle-label" id="lbl-lightning">
            <input type="checkbox" id="chk-lightning" onchange="toggleLayer('lightning', this)"> ⚡ Fulmini
        </label>
        <label class="toggle-label" id="lbl-cyclone">
            <input type="checkbox" id="chk-cyclone" onchange="toggleLayer('cyclone', this)"> 🌀 Uragani
        </label>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([45, 10], 5);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const eumetsatIR = L.tileLayer.wms('https://view.eumetsat.int/geoserver/wms', {
            layers: 'msg_fes:rgb_airmass',
            format: 'image/png',
            transparent: true,
            version: '1.3.0',
            opacity: 0.5,
            attribution: '© EUMETSAT'
        });

        const stormLayer = L.layerGroup().addTo(map);
        const cycloneLayer = L.layerGroup();
        const lightningLayer = L.layerGroup();

        function setContinent(btn, lat, lon, zoom) {
            map.setView([lat, lon], zoom);
            document.querySelectorAll('.top-dashboard-bar .nav-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function toggleLayer(type, checkbox) {
            const label = document.getElementById('lbl-' + type);
            if (checkbox.checked) {
                label.classList.add('active');
                if (type === 'ir') {
                    eumetsatIR.addTo(map);
                } else if (type === 'lightning') {
                    lightningLayer.addTo(map);
                    fetchLightningData();
                } else if (type === 'cyclone') {
                    cycloneLayer.addTo(map);
                    fetchTropicalCyclones();
                }
            } else {
                label.classList.remove('active');
                if (type === 'ir') map.removeLayer(eumetsatIR);
                if (type === 'lightning') lightningLayer.clearLayers() && map.removeLayer(lightningLayer);
                if (type === 'cyclone') cycloneLayer.clearLayers() && map.removeLayer(cycloneLayer);
            }
        }

        function fetchLightningData() {
            lightningLayer.clearLayers();
            const center = map.getCenter();
            const simulatedStrikes = [
                [center.lat + 0.04, center.lng + 0.07],
                [center.lat - 0.02, center.lng + 0.03],
                [center.lat + 0.01, center.lng - 0.05]
            ];
            simulatedStrikes.forEach((coords, index) => {
                L.marker(coords, {
                    icon: L.divIcon({
                        className: 'cell-3d-wrapper',
                        html: '<div style="background:#00ffff; width:9px; height:9px; border-radius:50%; box-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff; animation: pulse 1s infinite;"></div>',
                        iconSize: [9, 9], iconAnchor: [4, 4]
                    })
                }).bindPopup(`<b>[FULMINOMETRO]</b><br>Impatto CG #${index + 1}<br>Intensità: ~38 kA`).addTo(lightningLayer);
            });
        }

        function fetchTropicalCyclones() {
            fetch('https://www.nhc.noaa.gov/gis/reactive/storm_all.geojson')
                .then(res => res.json())
                .then(data => {
                    cycloneLayer.clearLayers();
                    L.geoJSON(data, {
                        pointToLayer: (feature, latlng) => {
                            return L.marker(latlng, {
                                icon: L.divIcon({
                                    className: 'cell-3d-wrapper',
                                    html: '<div style="background:#ff0055; width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow: 0 0 10px #ff0055;"></div>'
                                })
                            }).bindPopup(`<b>[CICLONE TROPICALE]</b><br>${feature.properties.STORMNAME || 'Attivo'}`);
                        }
                    }).addTo(cycloneLayer);
                })
                .catch(() => console.log("[HUD] Feed cicloni non disponibile."));
        }

        // Funzione di classificazione meteorologica avanzata guidata dal Python
        function getPythonMeteorologicalAnalysis(item) {
            // Se Python fornisce una classificazione esatta, usa quella, altrimenti la deriva dai parametri fisici (VIL, Echo Top, Vento)
            if (item.classification) return item.classification;
            
            const vil = item.vil || 25;
            const top = item.echo_top || 8;
            const wind = item.wind_speed || 40;

            if (vil > 45 && top > 11) return "Supercella con Hook Echo (Rotazione Mesociclonica)";
            if (vil > 38 && wind > 65) return "Bow Echo / Linea di Groppi Violenta (Squall Line)";
            if (vil > 35 && top > 9) return "Linea di Groppi (Squall Line Attiva)";
            if (top > 12 && vil > 40) return "MCC - Mesoscale Convective Complex (Profondo)";
            if (vil > 30) return "MCS - Sistema Convettivo a Mesoscala";
            if (wind > 55) return "MCV - Vortice Convettivo di Mesoscala";
            if (top > 10) return "Temporale a V-Shape / Scarico Convettivo";
            if (top < 7) return "Cella Convettiva Isolata (Pulse Storm)";
            return "Cella Convettiva / Sistema in Evoluzione";
        }

        function loadTrackerData() {
            fetch('centroids.json?' + new Date().getTime())
                .then(res => {
                    if (!res.ok) throw new Error("File dati non ancora disponibile");
                    return res.json();
                })
                .then(data => {
                    stormLayer.clearLayers();
                    if (data.radar_tile) {
                        L.tileLayer(`${data.radar_tile.host}${data.radar_tile.path}/256/{z}/{x}/{y}/2/1_1.png`, {
                            opacity: 0.65, zIndex: 200
                        }).addTo(stormLayer);
                    }
                    if (data.macro_structures) {
                        data.macro_structures.forEach(item => {
                            // Profilo 3D volumetrico della cella
                            const customIcon = L.divIcon({
                                className: 'cell-3d-wrapper',
                                html: `<div class="cell-3d-wrapper"><img src="${item.profile_image}" style="width:75px; height:45px; display:block; border:1px solid rgba(0,210,255,0.4); border-radius:3px; box-shadow:0 0 8px rgba(0,0,0,0.8);"></div>`,
                                iconSize: [75, 45], iconAnchor: [37, 22]
                            });
                            
                            const marker = L.marker(item.center, { icon: customIcon }).addTo(stormLayer);
                            
                            const meteoAnalysis = getPythonMeteorologicalAnalysis(item);

                            marker.bindPopup(`
                                <div style="font-family:monospace; font-size:11px; line-height:1.45; min-width:180px;">
                                    <b style="color:#00d2ff;">[ANALISI PYTHON RADAR]</b><br>
                                    <b>Tipologia:</b> <span style="color:#ffb700;">${meteoAnalysis}</span><br>
                                    <b>Stato Intensità:</b> ${item.intensity}<br>
                                    <b>Pressione al Suolo:</b> ${item.pressure} hPa<br>
                                    <b>Vento max:</b> ${item.wind_speed} km/h (${item.wind_dir}°)<br>
                                    <b>VIL (Acqua Integrata):</b> ${item.vil} kg/m²<br>
                                    <b>Eco Top (Altezza):</b> ${item.echo_top} km
                                </div>
                            `);

                            // Centroidi sempre attivi e visibili (Europa di default / Global)
                            L.marker(item.center, {
                                icon: L.divIcon({ className: 'cell-3d-wrapper', html: '<div class="centroid-dot"></div>', iconSize: [10, 10], iconAnchor: [5, 5] })
                            }).addTo(stormLayer);

                            // Vettori di spostamento e previsione
                            if (item.forecast_path && item.forecast_path.length > 0) {
                                L.polyline([item.center, ...item.forecast_path], {
                                    color: '#ffb700', weight: 3, dashArray: '4, 4', opacity: 0.85
                                }).addTo(stormLayer);
                            }
                        });
                    }
                })
                .catch(err => console.log("Telemetria in attesa di dati validi:", err));
        }

        loadTrackerData();
        setInterval(loadTrackerData, 180000);
    </script>
</body>
</html>
